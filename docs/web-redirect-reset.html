<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Redirecting to FitForge...</title>

		<style>
			:root {
				--bg: #18181b;
				--surface: #27272a;
				--accent: #22c55e;
				--text: #ffffff;
				--text-muted: #a1a1aa;
			}

			body {
				margin: 0;
				padding: 0;
				background: var(--bg);
				color: var(--text);
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				text-align: center;
			}

			.container {
				background: var(--surface);
				border-radius: 24px;
				padding: 3rem 2.5rem;
				max-width: 420px;
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
				border: 1px solid rgba(34, 197, 94, 0.15);
			}

			h1 {
				font-size: 2.1rem;
				font-weight: 700;
				margin: 0 0 0.75rem 0;
				letter-spacing: -0.04em;
				color: var(--accent);
			}

			p {
				color: var(--text-muted);
				font-size: 1.05rem;
				line-height: 1.5;
				margin-bottom: 2rem;
			}

			.spinner {
				width: 42px;
				height: 42px;
				border: 5px solid rgba(34, 197, 94, 0.2);
				border-top-color: var(--accent);
				border-radius: 50%;
				animation: spin 1s linear infinite;
				margin: 1.5rem auto;
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>FitForge</h1>
			<div class="spinner"></div>
			<p>Redirecting you back to the FitForge app...</p>

			<button id="manual-redirect" class="manual-btn" style="display: none">
				Open FitForge App Manually
			</button>

			<div id="error" class="error"></div>
		</div>

		<script>
			window.onload = function () {
				const hash = window.location.hash.substring(1);
				const params = new URLSearchParams(hash);

				const access_token = params.get("access_token");
				const refresh_token = params.get("refresh_token");
				const type = params.get("type"); // Supabase adds this

				const manualBtn = document.getElementById("manual-redirect");
				const errorDiv = document.getElementById("error");

				if (access_token && refresh_token) {
					let deepLink = "fitforge://";

					// Choose correct screen based on type
					if (type === "recovery") {
						// for resetting password
						deepLink += "reset-password";
					} else {
						// For signup confirmation
						deepLink += "login";
					}

					deepLink += `?access_token=${encodeURIComponent(access_token)}&refresh_token=${encodeURIComponent(refresh_token)}`;

					window.location.href = deepLink;
				} else {
					errorDiv.textContent = "Missing tokens. Please try again.";
					manualBtn.style.display = "block";
				}
			};
		</script>
	</body>
</html>
